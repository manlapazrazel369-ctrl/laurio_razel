<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .one{
        width: 25%;
        height: 300px;
        background-color: red;
        padding: 0;
    }
    .two{
        width: 25%;
        height: 300px;
        background-color: green;
        padding: 0;
    }
    .three{
        width: 25%;
        height: 300px;
        background-color: blue;
        padding: 0;
    }
    p{
        color: white;
        margin-top: 0;
        padding-top: 0;

    }
</style>
<body>
    <header><h1>CSS Diplay Property</h1></header>
    <div class="parent">
        <div class="one"><p>Red Paragraph</p></div>
        <div class="two"><p>Green Paragraph</p></div>
        <div class="three"><p>Blue Paragraph</p></div>
    </div>
    
</body>
</html>
